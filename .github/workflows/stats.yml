name: Atualizar stats

on:
  schedule:
    - cron: '17 6 * * *'   # todo dia ~03:17 (America/Sao_Paulo)
  workflow_dispatch:
  push:
    paths: ['scripts/build-stats.mjs', '.github/workflows/stats.yml']

permissions:
  contents: write

concurrency:
  group: stats
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Gerar SVGs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_LOGIN: ${{ github.repository_owner }}
        run: node scripts/build-stats.mjs

      - name: Commitar se mudou
        run: |
          if git diff --quiet -- assets/; then
            echo "Nada mudou."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats-dark.svg assets/stats-light.svg
          git commit -m "chore: atualiza stats do perfil"
          git push
