<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 20" width="1000" height="20" role="presentation">
  <defs>
    <linearGradient id="d" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#66BFAB" stop-opacity="0"/>
      <stop offset="30%"  stop-color="#66BFAB" stop-opacity=".9"/>
      <stop offset="55%"  stop-color="#82BF8C" stop-opacity=".9"/>
      <stop offset="80%"  stop-color="#A6C176" stop-opacity=".9"/>
      <stop offset="100%" stop-color="#A6C176" stop-opacity="0"/>
    </linearGradient>
    <filter id="g" x="-50%" y="-400%" width="200%" height="900%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      @keyframes run { 0% { transform: translateX(-40px) } 100% { transform: translateX(1040px) } }
      @keyframes pulse { 0%,100% { opacity:.35 } 50% { opacity:.9 } }
      #dot  { animation: run 5s cubic-bezier(.45,0,.55,1) infinite; }
      #line { animation: pulse 5s ease-in-out infinite; }
      @media (prefers-reduced-motion: reduce) { #dot,#line { animation: none } }
    </style>
  </defs>
  <rect id="line" x="0" y="9" width="1000" height="2" rx="1" fill="url(#d)"/>
  <circle id="dot" cx="0" cy="10" r="3.5" fill="#66BFAB" filter="url(#g)"/>
</svg>
